name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: macOS (universal)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build app + self-test
        run: cmake --build build --config Release --target NDIAudioBridge NDIAudioBridgeSelfTest -j 4

      - name: Self-test
        run: ./build/NDIAudioBridgeSelfTest_artefacts/Release/NDIAudioBridgeSelfTest

      - name: Build "NDI Audio Bridge" virtual audio device
        run: bash scripts/macos/build-virtual-device.sh build/virtual-device

      - name: Package
        run: |
          PKG="dist/NDI Audio Bridge"
          mkdir -p "$PKG"
          cp -R "build/NDIAudioBridge_artefacts/Release/NDI Audio Bridge.app" "$PKG/"
          codesign --force --deep --sign - "$PKG/NDI Audio Bridge.app"
          cp -R build/virtual-device/NDIAudioBridge.driver "$PKG/"
          cp scripts/macos/install-virtual-device.sh "$PKG/Install Virtual Audio Device.command"
          chmod +x "$PKG/Install Virtual Audio Device.command"
          cp README.md "$PKG/README.md"
          cd dist && ditto -c -k --keepParent "NDI Audio Bridge" ../NDI-Audio-Bridge-macOS.zip

      - uses: actions/upload-artifact@v6
        with:
          name: NDI-Audio-Bridge-macOS
          path: NDI-Audio-Bridge-macOS.zip

  windows:
    name: Windows (x64)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build app + self-test
        run: cmake --build build --config Release --target NDIAudioBridge NDIAudioBridgeSelfTest -- /m

      - name: Self-test
        run: build\NDIAudioBridgeSelfTest_artefacts\Release\NDIAudioBridgeSelfTest.exe
        shell: cmd

      - name: Package
        shell: pwsh
        run: |
          $pkg = "dist/NDI Audio Bridge"
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          Copy-Item "build/NDIAudioBridge_artefacts/Release/NDI Audio Bridge.exe" $pkg
          Copy-Item README.md $pkg
          Compress-Archive -Path $pkg -DestinationPath NDI-Audio-Bridge-Windows.zip

      - uses: actions/upload-artifact@v6
        with:
          name: NDI-Audio-Bridge-Windows
          path: NDI-Audio-Bridge-Windows.zip

  # Publishes a release when a v* tag is pushed, or when main is pushed with a
  # version in CMakeLists.txt that has no release yet (bump the version to release).
  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Decide release tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(sed -nE 's/^project\(NDIAudioBridge VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; bump the version in CMakeLists.txt to publish a new one."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v7
        if: steps.version.outputs.publish == 'true'
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        if: steps.version.outputs.publish == 'true'
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: NDI Audio Bridge ${{ steps.version.outputs.tag }}
          body_path: .github/release-notes.md
          files: artifacts/*.zip
